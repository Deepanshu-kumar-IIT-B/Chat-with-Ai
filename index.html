<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Aura: Your Human AI</title>
    <meta name="description" content="An emotionally intelligent, context-aware AI companion that chats like a real person, adapting to your mood and language naturally.">
    <meta property="og:title" content="Aura: Your Human AI">
    <meta property="og:description" content="An emotionally intelligent, context-aware AI companion that chats like a real person, adapting to your mood and language naturally.">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        // Prevent Flash of Unstyled Content (FOUC) and ensure instant theme application
        (function() {
            try {
                const saved = localStorage.getItem('aura_theme') || localStorage.getItem('aura_dark_mode');
                const isDark = saved === 'dark' || saved === 'true' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('light');
                } else {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('light');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
